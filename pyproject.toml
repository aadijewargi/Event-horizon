[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "event-horizon"
version = "0.1.0"
description = "Physically based Schwarzschild black hole ray tracer in pure NumPy"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8", "pillow>=9", "matplotlib>=3.5"]
keywords = ["black hole", "general relativity", "ray tracing", "physics", "simulation"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
blackhole = "blackhole.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
